spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: cineramaBD
    password: 123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    debug: true

  # camelCase en JSON (idSala, capacidadTotal, duracionMinutos, etc.)
  # NO usar SNAKE_CASE: rompe el binding con los Records y Swagger
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8082
  servlet:
    context-path: /cinerama
    session:
      cookie:
        # Path=/ para que el navegador envíe JSESSIONID también a /api/* (proxy de Angular)
        path: /
        http-only: true
        same-site: lax

logging:
  level:
    cinerama: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

cinerama:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    debug: true
    # Sin servidor de correo, devuelve el código de verificación en la respuesta
    # para poder completar el registro en local. Ponlo en false en producción.
    expose-dev-code: ${MAIL_EXPOSE_DEV_CODE:true}
  seed:
    # Crea datos de demostración (salas, butacas, dulcería, promociones y
    # funciones) solo en las tablas que estén vacías.
    demo-data: ${CINERAMA_SEED:true}
  upload:
    dir: uploads
